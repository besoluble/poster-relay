/* 레이아웃: 각자 폰 한 화면에 지금 자기 할 일 하나. 세로 한 줄(최대 460px), 맨 아래에 버튼 하나.

:root{
  --bg:#FFFFFF; --ink:#000FFF;
  --fg:var(--ink); --bk:var(--bg);
  --font:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --ease:.3s cubic-bezier(.4,0,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0E0E0D; --ink:#00FF00; color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0E0E0D; --ink:#00FF00; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bk);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased;transition:background-color var(--ease),color var(--ease)}
button{font:inherit;color:inherit;cursor:pointer;border-radius:2px}
p,h1,h2,ol,ul,dl,dd{margin:0}
.app{height:100%;min-height:540px;max-width:460px;margin-inline:auto}

/* 한 화면 */
.screen{height:100%;display:flex;flex-direction:column;gap:18px;padding:28px 24px calc(20px + env(safe-area-inset-bottom,0px))}
.screen.tight{gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.grow{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:18px;scrollbar-width:none}
.grow::-webkit-scrollbar{display:none}
.eyebrow{font-size:13px}
.center{text-align:center}
.mk{display:inline-block;width:.72em;height:.72em;border:1px solid var(--fg);margin-right:.4em;vertical-align:-.02em}
.mk.a{background:var(--fg)}
.huge{font-weight:500;font-size:clamp(52px,17vw,78px);line-height:1.04;letter-spacing:-.03em;overflow-wrap:anywhere}
.giant{font-weight:500;font-size:clamp(120px,46vw,200px);line-height:1;letter-spacing:-.04em;text-align:center;font-variant-numeric:tabular-nums;margin-block:auto}
.title{font-weight:500;font-size:clamp(30px,9vw,40px);line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.rule{flex:none;border:0;border-top:1px solid var(--fg);margin:0;width:100%}
.cta{flex:none;width:100%;height:56px;border:1px solid var(--fg);background:var(--fg);color:var(--bk);font-size:16px;font-weight:600;letter-spacing:.01em}
.cta:active{background:var(--bk);color:var(--fg)}
.cta:disabled{background:transparent;color:var(--fg);border-style:dashed;cursor:default}
.cta.ghost{background:transparent;color:var(--fg)}
.cta.ghost:active{background:var(--fg);color:var(--bk)}
.quiet{flex:none;align-self:center;border:0;background:transparent;font-size:13px;padding:4px 10px;text-decoration:underline dashed;text-underline-offset:3px}
.quiet-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.foot{flex:none;display:flex;flex-direction:column;gap:12px}

/* 번호 붙은 목록, 항목과 값 */
.list{list-style:none;padding:0;display:flex;flex-direction:column;counter-reset:n}
.list li{counter-increment:n;display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:start;padding-block:10px;border-top:1px solid var(--fg)}
.list li:last-child{border-bottom:1px solid var(--fg)}
.list li::before{content:counter(n, decimal-leading-zero);font-variant-numeric:tabular-nums}
.list b{font-weight:600;display:block}
.src{display:block;font-size:12px;opacity:.7}
.list em{font-style:normal;font-size:12px;border:1px solid var(--fg);border-radius:2px;padding:0 6px;margin-left:8px}
.list button{border:0;background:transparent;font-size:13px;padding:0 0 0 12px;text-decoration:underline dashed;text-underline-offset:3px}
.facts{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px 12px;align-items:center}
.facts dt{font-size:13px}
.seg{display:flex}
.seg button{flex:1 1 0;min-width:0;height:44px;border:1px solid var(--fg);background:transparent;font-size:14px}
.seg button + button{margin-left:-1px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bk)}
.seg button:disabled{opacity:.35}
.join{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:8px}
input[type="text"]{font:inherit;font-size:16px;height:56px;min-width:0;border:1px solid var(--fg);border-radius:2px;background:transparent;color:var(--fg);padding:0 14px}
input[type="text"]::placeholder{color:var(--fg);opacity:.5}

.target .tw{width:76px;flex:none}
.target div.tx{min-width:0;display:flex;flex-direction:column;font-size:13px}
.target b{font-weight:600;font-size:15px}
.deal{gap:10px;perspective:900px;overflow:visible}
.pc{flex:1 1 0;min-height:88px;border:0;padding:0;background:transparent;text-align:left;display:flex}
.pc-in{flex:1;min-width:0;position:relative;display:flex;transform-style:preserve-3d}
.pc-f,.pc-b{border:1px solid var(--fg);border-radius:2px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pc-f{flex:1;min-width:0;background:var(--bk);padding:12px 16px;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.pc-b{position:absolute;inset:0;transform:rotateY(180deg);background:repeating-linear-gradient(45deg,var(--bk) 0 7px,var(--fg) 7px 8px)}
.pc small{font-size:12px;font-variant-numeric:tabular-nums}
.pc b{font-weight:500;font-size:clamp(21px,6.2vw,26px);line-height:1.15;letter-spacing:-.02em}
.pc-f > span{font-size:13px;line-height:1.4}
.pc[aria-pressed="true"] .pc-f{background:var(--fg);color:var(--bk)}
.pc:nth-child(1){--oy:calc(100% + 10px);--sx:-1;z-index:3}
.pc:nth-child(2){--oy:0px;--sx:1;z-index:2}
.pc:nth-child(3){--oy:calc(-100% - 10px);--sx:-1;z-index:1}

/* 고치는 화면, 지켜보는 화면 */
.play{height:100%;display:flex;flex-direction:column;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.top{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
#quitW{justify-self:end;display:flex}
.who{font-size:13px;min-width:0}
.skip{justify-self:end;border:1px solid var(--fg);background:transparent;padding:5px 10px;font-size:12.5px;white-space:nowrap}
.clock{font-weight:500;font-size:44px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;min-width:1.5em;text-align:center;padding:2px 6px;border-radius:2px}
.clock.hot{background:var(--fg);color:var(--bk)}
.prog{flex:none;height:1px;border-bottom:1px dashed var(--fg);position:relative}

.hud{flex:none;display:flex;flex-direction:column;border-bottom:1px solid var(--fg)}
.hr{display:grid;grid-template-columns:28px repeat(3,minmax(0,1fr));align-items:center;font-size:12.5px;line-height:1.25;padding-block:5px}
.hr + .hr{border-top:1px dashed var(--fg)}
.hr .mk{margin-right:0}
.hp{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px}
.hp b{font-weight:600}
.hp.me b{text-decoration:underline;text-underline-offset:3px}
.hp.w::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--fg);margin-right:4px;vertical-align:.12em}
.strip{flex:none;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-height:30px;align-items:center;font-size:13px}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;border:1px solid var(--fg);background:transparent;padding:3px 10px;font-size:13px;white-space:nowrap}
.canvas{flex:1;min-height:0;position:relative;display:grid;place-items:center;container-type:size}
.poster{position:relative;width:min(100cqw, calc(100cqh * 5 / 7));aspect-ratio:5 / 7;container-type:inline-size;overflow:hidden;touch-action:none;outline:1px solid var(--fg);outline-offset:-1px}
.poster.thumb{width:100%;touch-action:auto}
.poster.ro{touch-action:auto}
.el{position:absolute;user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab}
.el.text{width:max-content;max-width:94cqw;text-align:center;line-height:1.15;word-break:keep-all;overflow-wrap:anywhere;padding:.08em .14em}
.el.shape[data-shape="circle"]{border-radius:50%}

.thumb .el,.ro .el{pointer-events:none;cursor:default}
.toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:max-content;max-width:92%;background:var(--fg);color:var(--bk);border-radius:2px;padding:8px 12px;font-size:13px;line-height:1.4;z-index:60;text-align:center;pointer-events:none}
.toast b{font-weight:600}
.tools{flex:none;display:flex;flex-direction:column;gap:8px}
.cap{flex:none;font-size:13px;min-height:21px;text-align:center}
.cap b{font-weight:600}
.ctl{height:46px;display:flex;align-items:center;justify-content:center;gap:8px}
.ctl .seg{flex:1}
.ctl input[type="range"]{width:100%;accent-color:var(--fg);height:32px}
.sw{flex:1 1 0;min-width:0;max-width:40px;aspect-ratio:1;border:1px solid var(--fg);padding:0}

.badge{font-size:12px;font-weight:600;background:var(--fg);color:var(--bk);border-radius:2px;padding:0 7px}
.duo figure.win .poster{outline-width:3px;outline-offset:-3px}

.nums div{display:flex;flex-direction:column;line-height:1.25}

.nums span{font-size:12px}
.dots::after{content:""}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:200}
button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

@media (prefers-reduced-motion:no-preference){

  @keyframes blink{50%{background:var(--bk);color:var(--fg)}}
  .dots::after{animation:dots 1.2s steps(4,end) infinite}

}

  /* ---------- 자가 시험: 주인이 링크 끝에 #selftest 를 붙여 열면, 입장부터 끝 화면까지 스스로 한 판 돌고 기록을 남긴다 ---------- */
  function stLog(msg){

  /* ---------- AI 심사 ---------- */
  function wrapLines(ctx, text, maxW){
    const words = text.split(' '), lines = [];
    let cur = '';
    for (const w of words) {
      const next = cur ? cur + ' ' + w : w;
      if (cur && ctx.measureText(next).width > maxW) { lines.push(cur); cur = w; } else cur = next;
    }
    if (cur) lines.push(cur);
    return lines;
  }
  function posterBlob(P){
    const Wd = 600, H = 840, c = document.createElement('canvas');

    x.fillStyle = COLORS[P.bg][1]; x.fillRect(0, 0, Wd, H);
    for (const e of P.els) {
      x.save();
      x.translate(e.x / 100 * Wd, e.y / 100 * H);
      x.rotate(e.r * Math.PI / 180);
      x.fillStyle = COLORS[e.c][1];
      if (e.kind === 'shape') {
        const s = e.s / 100 * Wd;
        x.beginPath();
        if (e.shape === 'circle') x.arc(0, 0, s / 2, 0, Math.PI * 2);
        else if (e.shape === 'rect') x.rect(-s / 2, -s / 2, s, s);

심사할 것은 두 가지입니다.
1) AI 평가(ai): 카드와는 무관하게, 포스터 자체가 얼마나 좋은지 0부터 100까지의 정수로 매깁니다. 처음 보는 사람이 무슨 전시를 언제 어디서 하는지 알 수 있는지, 벽에 붙어 있으면 눈이 가고 아름다운지를 함께 봅니다. 카드를 지켰는지는 이 점수에 넣지 않습니다.
2) 규칙 준수(broken): 받은 카드를 하나씩 확인해, 지키지 못한 카드의 제목을 위 목록에 적힌 그대로 broken에 넣습니다. 서로 모순되는 카드를 받았더라도 지키지 못한 카드는 그대로 적습니다. 위치는 3% 안팎, 크기는 10% 안팎의 오차를 허용합니다.

최종 점수는 규칙 준수 30%와 AI 평가 70%로 페이지가 계산하니, 승자는 정하지 않아도 됩니다. 평은 한국어로 짧고 구체적으로 쓰고, 심사위원다운 유머가 조금 있어도 좋습니다.

다음 모양의 JSON만 답하세요:
{"verdict":"두 포스터를 비교한 총평 두세 문장","A":{"ai":72,"comment":"한 줄 평","broken":["어긴 카드 제목"]},"B":{"ai":58,"comment":"한 줄 평","broken":[]}}`;
  }
  function cleanSide(v){
    v = v && typeof v === 'object' ? v : {};
    return {ai:clamp(Math.round(Number(v.ai) || 0), 0, 100), comment:String(v.comment || '').slice(0, 300),
      broken:Array.isArray(v.broken) ? v.broken.slice(0, 12).map(b => String(b).slice(0, 40)) : []};
  }
  const JUDGE_COPY = {
    not_granted:'AI 사용을 허용하지 않아 심사를 하지 못했습니다. 다시 누르고 허용해 주세요.',
    sampling_disabled:'이 계정에서는 AI 심사를 쓸 수 없습니다.',
    rate_limited:'사용량 한도에 걸렸습니다. 잠시 뒤에 다시 눌러 주세요.',
    session_expired:'로그인이 풀렸습니다. 다시 로그인한 뒤 눌러 주세요.',
  };
  async function judge(){
    if (judging || amOwner === false || lastView !== 'done' || !posters[0] || !posters[1]) return;
    if (ST) {
      if (judgingElsewhere()) return;
      judgeNote = '';
      try { await db.doc(`games/${subGid}/meta/verdict`).set({judgingAt:now()}); } catch (e) { judgeNote = '심사 요청을 보내지 못했습니다. 다시 눌러 주세요.'; }
      sync();
      return;
    }
    const gid = subGid, vref = db.doc(`games/${gid}/meta/verdict`);
    judging = true; judgeNote = '';
    sync();
    let held = false;
    try {
      const sample = window.claude && window.claude.use ? await window.claude.use('sample') : null;
      if (!sample) { judgeNote = '이 화면에서는 AI 심사를 쓸 수 없습니다.'; return; }
      let lease = null;
      try { lease = await vref.acquire({holder:me, ttlMs:150000, data:{judgingAt:Date.now()}}); } catch (e) { lease = {acquired:true}; }
      if (lease && lease.acquired === false) { judgeNote = '다른 폰에서 이미 심사하고 있습니다.'; return; }
      held = true;
      const lim = await sample.limits().catch(() => null);
      let images = null;
      if (lim && lim.images && lim.images.maxCount >= 2) {
        try {
          const all = BRIEF.map(b => b.text).join('');
          await Promise.all(FONTS.map(f => document.fonts.load(`${f[2]} 40px ${f[1]}`, all)));
        } catch (e) {}
        const blobs = await Promise.all([0, 1].map(t => posterBlob(posters[t].P)));
        if (blobs.every(Boolean)) images = blobs;
      }
      judgeCtl = new AbortController();
      const opts = {cache:false, signal:judgeCtl.signal};
      if (images) opts.images = images;
      const out = await sample.json(judgePrompt(!!images, cardsAt(room.rounds - 1)), opts);
      if (!out || typeof out !== 'object') throw {code:'invalid_json'};
      const v = {winner:'A', verdict:String(out.verdict || '').slice(0, 600), A:cleanSide(out.A), B:cleanSide(out.B)};
      const keep = verdictDoc; verdictDoc = v; v.winner = scoreOf(1).total > scoreOf(0).total ? 'B' : 'A'; verdictDoc = keep;
      held = false;
      await vref.set(v);
    } catch (e) {
      const code = e && e.code;
      if (code !== 'cancelled') judgeNote = JUDGE_COPY[code] || '심사를 끝내지 못했습니다. 다시 눌러 주세요.';
    } finally {
      if (held) { try { await vref.set({failedAt:Date.now()}); } catch (e) {} }
      judging = false; judgeCtl = null;
      sync();
    }
  }

  /* ---------- 포스터 손질: 끌기, 두 손가락, 겹친 요소 넘기기 ---------- */
  function snapRot(v){
    v = ((v + 180) % 360 + 360) % 360 - 180;
    for (const m of [-180, -90, 0, 90, 180]) if (Math.abs(v - m) <= 4) return m === -180 ? 180 : m;
    return Math.round(v);
  }
  const two = () => { const [p, q] = [...pts.values()]; return {d:Math.hypot(q.x - p.x, q.y - p.y) || 1, a:Math.atan2(q.y - p.y, q.x - p.x)}; };
  poster.addEventListener('pointerdown', ev => {
    if (!W) return;
    ev.preventDefault();
    pts.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
    try { poster.setPointerCapture(ev.pointerId); } catch (err) {}
    if (pts.size >= 2) {
      drag = null;
      const e = sel && el(sel);
      if (e && pts.size === 2) { const g = two(); pinch = {d:g.d, a:g.a, s:e.s, r:e.r}; }
      return;
    }
    const n = ev.target.closest && ev.target.closest('.el');
    if (!n) { drag = {id:null}; return; }
    const id = n.dataset.id, was = sel === id;
    if (!was) select(id);
    const e = el(id);
    if (!e) return;
    const r = poster.getBoundingClientRect();
    drag = {id, was, moved:false, px:ev.clientX, py:ev.clientY, x:e.x, y:e.y, w:r.width, h:r.height};
  });
  poster.addEventListener('pointermove', ev => {
    const p = pts.get(ev.pointerId);
    if (!p || !W) return;
    p.x = ev.clientX; p.y = ev.clientY;
    if (pinch && pts.size >= 2) {
      const e = sel && el(sel);
      if (!e) return;
      const g = two(), lim = LIM[e.kind];
      e.s = clamp(Math.round(pinch.s * g.d / pinch.d * 2) / 2, lim[0], lim[1]);
      e.r = snapRot(pinch.r + (g.a - pinch.a) * 180 / Math.PI);
      paintMain(); touch();
      return;
    }
    if (!drag || !drag.id) return;
    const dx = ev.clientX - drag.px, dy = ev.clientY - drag.py;
    if (!drag.moved && Math.hypot(dx, dy) < 5) return;
    drag.moved = true;
    const e = el(drag.id);
    if (!e) return;
    e.x = clamp(drag.x + dx / drag.w * 100, 0, 100);
    e.y = clamp(drag.y + dy / drag.h * 100, 0, 100);
    paintMain(); touch();
  });
  function pointerEnd(ev){
    if (!pts.has(ev.pointerId)) return;
    pts.delete(ev.pointerId);
    if (pinch) {
      if (pts.size < 2) { pinch = null; drag = null; if (W) renderTools(); }
      return;
    }
    const d = drag;
    drag = null;
    if (!d || !W || ev.type === 'pointercancel') return;
    if (!d.id) { if (sel) select(null); return; }
    if (d.moved) return;
    if (d.was && document.elementsFromPoint) {
      const stack = document.elementsFromPoint(ev.clientX, ev.clientY)
        .filter(n => n.classList && n.classList.contains('el') && poster.contains(n)).map(n => n.dataset.id);
      if (stack.length > 1) select(stack[(stack.indexOf(d.id) + 1) % stack.length]);
    }
  }
  poster.addEventListener('pointerup', pointerEnd);
  poster.addEventListener('pointercancel', pointerEnd);

  document.addEventListener('keydown', ev => {
    if (!W || !sel || /^(INPUT|TEXTAREA)$/.test(ev.target.tagName)) return;
    const d = {ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1]}[ev.key];
    const e = el(sel);
    if (!d || !e) return;
    e.x = clamp(e.x + d[0], 0, 100); e.y = clamp(e.y + d[1], 0, 100);
    paintMain(); touch(); ev.preventDefault();
  });

  /* ---------- 버튼 ---------- */
  tools.addEventListener('input', ev => {
    const d = ev.target.dataset;
    if (!d.range || !W) return;
    const e = sel && el(sel);
    if (e) { e[d.range] = +ev.target.value; paintMain(); touch(); }
  });
  document.addEventListener('submit', ev => {
    if (ev.target.id !== 'joinForm') return;
    ev.preventDefault();
    const inp = $('name-input');
    if (inp) { beep(660, .08); join(inp.value); }
  });
  document.addEventListener('input', ev => { if (ev.target.id === 'name-input') myName = ev.target.value; });
  $('app').addEventListener('click', ev => {
    const b = ev.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const act = b.dataset.act, v = b.dataset.v;
    const e = W && sel ? el(sel) : null;
    switch (act) {
      case 'kick': leave(v); break;
      case 'rounds': if (room.status === 'lobby') setRounds(+v); break;
      case 'bots': addBots(); break;
      case 'teams': beep(660, .1); makeTeams(); break;
      case 'go': beep(880, .1); startGame(); break;
      case 'pick': pick(+v); break;
      case 'new': confirmNew = true; sync(); break;
      case 'new-no': confirmNew = false; sync(); break;
      case 'new-yes': if (judgeCtl) judgeCtl.abort(); newGame(); break;
      case 'quit': if (quitArmed()) { quitAt = 0; newGame(); } else { quitAt = Date.now(); sync(); } break;
      case 'tool': if (W) { if (e) toolSel = v; else toolNone = v; renderTools(); } break;
      case 'tip': showTip(+v); break;
      case 'color': if (e) { e.c = +v; paintMain(); renderTools(); touch(); } break;
      case 'font': if (e) { e.f = +v; paintMain(); renderTools(); touch(); } break;
      case 'shape': if (e) { e.shape = v; paintMain(); renderTools(); touch(); } break;
      case 'front': case 'back':
        if (e) {
          W.els = W.els.filter(x => x !== e);
          if (act === 'front') W.els.push(e); else W.els.unshift(e);
          paintMain(); touch();
        }
        break;
      case 'bg': if (W) { W.bg = +v; paintMain(); renderTools(); touch(); } break;
      case 'add-shape':
        if (W) {
          let k = 1;
          while (el('shape' + k)) k++;
          W.els.push({id:'shape' + k, kind:'shape', label:'도형 ' + k, shape:v, x:50, y:50, s:20, r:0, c:4});
          touch(); select('shape' + k);
        }
        break;
      case 'reset-turn':
        if (W && turnStart) { W = clone(turnStart); sel = null; paintMain(); renderTools(); touch(); }
        break;
      case 'lapse': lapse(); break;
      case 'judge': judge(); break;
      case 'judge-stop': if (judgeCtl) judgeCtl.abort(); break;
    }
  });

  init();
})();
</script>
</body></html>
